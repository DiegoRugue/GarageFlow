services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garageflow}
      POSTGRES_USER: ${POSTGRES_USER:-garageflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garageflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - garageflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garageflow} -d ${POSTGRES_DB:-garageflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8.14
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@garageflow.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_SERVER_MODE:-False}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - garageflow_pgadmin_data:/var/lib/pgadmin

  api:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__Provider: ${DATABASE_PROVIDER:-Postgres}
      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-true}
      Database__AutoSeed: ${DATABASE_AUTO_SEED:-true}
      Database__SeedScriptPath: ${DATABASE_SEED_SCRIPT_PATH:-scripts/seed-local.sql}
      ConnectionStrings__GarageFlow: "Host=${POSTGRES_HOST:-postgres};Port=5432;Database=${POSTGRES_DB:-garageflow};Username=${POSTGRES_USER:-garageflow};Password=${POSTGRES_PASSWORD:-garageflow}"
      Auth__Jwt__Issuer: ${AUTH_JWT_ISSUER:-GarageFlow}
      Auth__Jwt__Audience: ${AUTH_JWT_AUDIENCE:-GarageFlow.Adapters.Api}
      Auth__Jwt__Key: ${AUTH_JWT_KEY:-local-dev-jwt-key-change-me-please-32chars}
      Auth__Jwt__ExpiresMinutes: ${AUTH_JWT_EXPIRES_MINUTES:-120}
      Auth__BootstrapAdmin__FullName: ${BOOTSTRAP_ADMIN_FULL_NAME:-Development Admin}
      Auth__BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-admin-dev@garageflow.local}
      Auth__BootstrapAdmin__BirthDate: ${BOOTSTRAP_ADMIN_BIRTH_DATE:-1990-01-01}
      Auth__BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@12345}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  garageflow_postgres_data:
  garageflow_pgadmin_data:
