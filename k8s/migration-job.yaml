apiVersion: batch/v1
kind: Job
metadata:
  name: garageflow-migration
  namespace: garageflow
  labels:
    app.kubernetes.io/name: garageflow-api
    app.kubernetes.io/part-of: garageflow
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garageflow-api
        app.kubernetes.io/part-of: garageflow
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: garageflow-api:local
          imagePullPolicy: IfNotPresent
          args:
            - --migrate-only
          envFrom:
            - configMapRef:
                name: garageflow-config
            - secretRef:
                name: garageflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
