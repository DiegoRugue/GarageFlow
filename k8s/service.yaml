apiVersion: v1
kind: Service
metadata:
  name: garageflow-api
  namespace: garageflow
  labels:
    app.kubernetes.io/name: garageflow-api
    app.kubernetes.io/part-of: garageflow
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: garageflow-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
