apiVersion: v1
kind: Secret
metadata:
  name: garageflow-secrets
  namespace: garageflow
  labels:
    app.kubernetes.io/name: garageflow-api
    app.kubernetes.io/part-of: garageflow
  annotations:
    garageflow.io/template-only: "true"
type: Opaque
stringData:
  ConnectionStrings__GarageFlow: "${CONNECTION_STRING}"
  Auth__Jwt__Key: "${JWT_KEY}"
  Auth__BootstrapAdmin__Email: "${BOOTSTRAP_EMAIL}"
  Auth__BootstrapAdmin__Password: "${BOOTSTRAP_INITIAL_PASSWORD}"
  Webhooks__EstimateDecisions__HmacSecret: "${WEBHOOK_SECRET}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN}"
