name: Destroy AWS Academy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to remove the GarageFlow Academy environment
        required: true
        type: string
      kubernetes_version:
        description: EKS version used by the current Academy state
        required: true
        default: "1.36"
        type: string

permissions:
  contents: read

concurrency:
  group: aws-academy-lifecycle
  cancel-in-progress: false

jobs:
  destroy:
    name: Remove environment and verify absence
    runs-on: ubuntu-latest
    environment: aws-academy
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_kubernetes_version: ${{ inputs.kubernetes_version }}
      TF_VAR_eks_cluster_role_arn: ${{ secrets.EKS_CLUSTER_ROLE_ARN }}
      TF_VAR_eks_node_role_arn: ${{ secrets.EKS_NODE_ROLE_ARN }}
      TF_VAR_owner: ${{ vars.TF_OWNER }}
      TF_VAR_expires_on: ${{ vars.TF_EXPIRES_ON }}
      TF_VAR_notification_email: ${{ vars.SNS_NOTIFICATION_EMAIL }}
      TF_VAR_bootstrap_admin_email: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
      DESTROY_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Fail closed on confirmation and protected inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${DESTROY_CONFIRMATION}" != 'DESTROY' ]]; then
            echo 'Destruction refused: confirmation must be exactly DESTROY.' >&2
            exit 1
          fi

          missing=()
          for name in \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN TF_STATE_BUCKET \
            TF_VAR_eks_cluster_role_arn TF_VAR_eks_node_role_arn TF_VAR_owner \
            TF_VAR_expires_on TF_VAR_notification_email TF_VAR_bootstrap_admin_email; do
            [[ -n "${!name:-}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Destruction refused: missing protected Environment inputs: ${missing[*]}" >&2
            exit 1
          fi
          [[ "${AWS_REGION}" == 'us-east-1' ]] || {
            echo 'Destruction refused: AWS region must be us-east-1.' >&2
            exit 1
          }
          python3 - <<'PY'
          import datetime
          import os
          import re
          import sys

          errors = []
          owner = os.environ["TF_VAR_owner"]
          expires_on = os.environ["TF_VAR_expires_on"]
          kubernetes_version = os.environ["TF_VAR_kubernetes_version"]
          email_pattern = re.compile(r"^[^@\s]+@[^@\s]+\.[^@\s]+$")
          role_pattern = re.compile(
              r"^arn:[a-z0-9-]+:iam::[0-9]{12}:role/"
              r"[A-Za-z0-9+=,.@_/-]*[A-Za-z0-9+=,.@_-]$"
          )

          if not owner.strip():
              errors.append("TF_VAR_owner must not be blank")
          if re.fullmatch(r"[0-9]+\.[0-9]+", kubernetes_version) is None:
              errors.append("TF_VAR_kubernetes_version must use major.minor notation")
          if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", expires_on) is None:
              errors.append("TF_VAR_expires_on must use YYYY-MM-DD")
          else:
              try:
                  datetime.date.fromisoformat(expires_on)
              except ValueError:
                  errors.append("TF_VAR_expires_on must be a real calendar date")
          for name in ("TF_VAR_notification_email", "TF_VAR_bootstrap_admin_email"):
              if email_pattern.fullmatch(os.environ[name].strip()) is None:
                  errors.append(f"{name} must be a valid email-shaped value without whitespace")
          for name in ("TF_VAR_eks_cluster_role_arn", "TF_VAR_eks_node_role_arn"):
              if role_pattern.fullmatch(os.environ[name]) is None:
                  errors.append(f"{name} must exactly match the Terraform IAM role ARN contract")
          if errors:
              print("Destruction refused: " + "; ".join(errors), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Verify identity and remote state before mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${TF_VAR_eks_cluster_role_arn}" =~ ^arn:[a-z0-9-]+:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]*[A-Za-z0-9+=,.@_-]$ ]]; then
            cluster_role_account="${BASH_REMATCH[1]}"
          else
            echo 'EKS cluster role ARN is invalid.' >&2
            exit 1
          fi
          if [[ "${TF_VAR_eks_node_role_arn}" =~ ^arn:[a-z0-9-]+:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]*[A-Za-z0-9+=,.@_-]$ ]]; then
            node_role_account="${BASH_REMATCH[1]}"
          else
            echo 'EKS node role ARN is invalid.' >&2
            exit 1
          fi
          if [[ ! "${caller_account}" =~ ^[0-9]{12}$ ]] || \
            [[ "${caller_account}" != "${cluster_role_account}" ]] || \
            [[ "${cluster_role_account}" != "${node_role_account}" ]]; then
            echo 'AWS identity does not match both protected EKS role accounts.' >&2
            exit 1
          fi
          [[ "${AWS_REGION}" == 'us-east-1' ]]

          terraform -chdir=infra/environments/academy init \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config='key=academy/terraform.tfstate' \
            -backend-config='region=us-east-1' \
            -backend-config='encrypt=true' \
            -backend-config='use_lockfile=true'
          terraform -chdir=infra/environments/academy state list >/dev/null
          echo 'AWS identity and remote state readability verified before mutation.'

      - name: Remove Kubernetes Service and wait for cloud load balancer cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          cluster_name='garageflow-academy'
          error_file="${RUNNER_TEMP}/garageflow-eks-describe.err"
          cluster_exists=false
          if aws eks describe-cluster \
            --region us-east-1 \
            --name "${cluster_name}" >/dev/null 2>"${error_file}"; then
            cluster_exists=true
          else
            first_error_line=''
            IFS= read -r first_error_line <"${error_file}" || true
            aws_error_pattern='^An error occurred \(([A-Za-z0-9]+)\) when calling the [^:]+ operation:'
            if [[ "${first_error_line}" =~ ${aws_error_pattern} ]] && \
              [[ "${BASH_REMATCH[1]}" == 'ResourceNotFoundException' ]]; then
              cluster_exists=false
            else
              echo 'Unable to determine whether the GarageFlow EKS cluster exists.' >&2
              exit 1
            fi
          fi
          rm -f -- "${error_file}"

          service_ingress=''
          if [[ "${cluster_exists}" == true ]]; then
            aws eks update-kubeconfig --region us-east-1 --name "${cluster_name}"
            service_ingress="$(kubectl -n garageflow get service garageflow-api \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [[ -z "${service_ingress}" ]]; then
              service_ingress="$(kubectl -n garageflow get service garageflow-api \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            fi
            kubectl -n garageflow delete service garageflow-api \
              --ignore-not-found --wait=true --timeout=10m
            kubectl -n garageflow wait --for=delete service/garageflow-api \
              --timeout=10m || {
              echo 'GarageFlow Service deletion or finalizer wait failed.' >&2
              exit 1
            }
            kubectl delete namespace garageflow \
              --ignore-not-found --wait=true --timeout=10m
            kubectl wait --for=delete namespace/garageflow \
              --timeout=10m || {
              echo 'GarageFlow namespace deletion did not complete.' >&2
              exit 1
            }
          fi

          count_elbv2_service_load_balancers() {
            local load_balancers_json load_balancer_rows arn dns tags_json count=0 jq_status
            if ! load_balancers_json="$(aws elbv2 describe-load-balancers --region us-east-1 --output json)"; then
              echo 'Unable to list ELBv2 load balancers during cleanup.' >&2
              return 1
            fi
            if ! jq -e 'type == "object" and (.LoadBalancers | type == "array") and all(.LoadBalancers[]; (.LoadBalancerArn | type == "string") and (.DNSName | type == "string"))' \
              >/dev/null <<<"${load_balancers_json}"; then
              echo 'ELBv2 returned malformed load-balancer JSON during cleanup.' >&2
              return 1
            fi
            if ! load_balancer_rows="$(jq -r \
              '.LoadBalancers[] | [.LoadBalancerArn, .DNSName] | @tsv' \
              <<<"${load_balancers_json}")"; then
              echo 'Unable to enumerate ELBv2 load-balancer rows during cleanup.' >&2
              return 1
            fi
            while IFS=$'\t' read -r arn dns; do
              [[ -n "${arn}" ]] || continue
              if ! tags_json="$(aws elbv2 describe-tags \
                --region us-east-1 --resource-arns "${arn}" --output json)"; then
                echo 'Unable to read ELBv2 tags during cleanup.' >&2
                return 1
              fi
              if ! jq -e 'type == "object" and (.TagDescriptions | type == "array") and all(.TagDescriptions[]; (.Tags | type == "array"))' \
                >/dev/null <<<"${tags_json}"; then
                echo 'ELBv2 returned malformed tag JSON during cleanup.' >&2
                return 1
              fi
              if [[ -n "${service_ingress}" && "${dns}" == "${service_ingress}" ]]; then
                (( count += 1 ))
                continue
              fi
              set +e
              jq -e 'any(.TagDescriptions[].Tags[]?; .Key == "kubernetes.io/service-name" and .Value == "garageflow/garageflow-api")' \
                >/dev/null <<<"${tags_json}"
              jq_status=$?
              set -e
              if (( jq_status == 0 )); then
                (( count += 1 ))
              elif (( jq_status > 1 )); then
                echo 'Unable to parse ELBv2 tags during cleanup.' >&2
                return 1
              fi
            done <<<"${load_balancer_rows}"
            printf '%s\n' "${count}"
          }

          count_classic_service_load_balancers() {
            local load_balancers_json load_balancer_rows name dns tags_json count=0 jq_status
            if ! load_balancers_json="$(aws elb describe-load-balancers --region us-east-1 --output json)"; then
              echo 'Unable to list Classic ELB load balancers during cleanup.' >&2
              return 1
            fi
            if ! jq -e 'type == "object" and (.LoadBalancerDescriptions | type == "array") and all(.LoadBalancerDescriptions[]; (.LoadBalancerName | type == "string") and (.DNSName | type == "string"))' \
              >/dev/null <<<"${load_balancers_json}"; then
              echo 'Classic ELB returned malformed load-balancer JSON during cleanup.' >&2
              return 1
            fi
            if ! load_balancer_rows="$(jq -r \
              '.LoadBalancerDescriptions[] | [.LoadBalancerName, .DNSName] | @tsv' \
              <<<"${load_balancers_json}")"; then
              echo 'Unable to enumerate Classic ELB rows during cleanup.' >&2
              return 1
            fi
            while IFS=$'\t' read -r name dns; do
              [[ -n "${name}" ]] || continue
              if ! tags_json="$(aws elb describe-tags \
                --region us-east-1 --load-balancer-names "${name}" --output json)"; then
                echo 'Unable to read Classic ELB tags during cleanup.' >&2
                return 1
              fi
              if ! jq -e 'type == "object" and (.TagDescriptions | type == "array") and all(.TagDescriptions[]; (.Tags | type == "array"))' \
                >/dev/null <<<"${tags_json}"; then
                echo 'Classic ELB returned malformed tag JSON during cleanup.' >&2
                return 1
              fi
              if [[ -n "${service_ingress}" && "${dns}" == "${service_ingress}" ]]; then
                (( count += 1 ))
                continue
              fi
              set +e
              jq -e 'any(.TagDescriptions[].Tags[]?; .Key == "kubernetes.io/service-name" and .Value == "garageflow/garageflow-api")' \
                >/dev/null <<<"${tags_json}"
              jq_status=$?
              set -e
              if (( jq_status == 0 )); then
                (( count += 1 ))
              elif (( jq_status > 1 )); then
                echo 'Unable to parse Classic ELB tags during cleanup.' >&2
                return 1
              fi
            done <<<"${load_balancer_rows}"
            printf '%s\n' "${count}"
          }

          load_balancer_deadline=$((SECONDS + 900))
          while true; do
            elbv2_count="$(count_elbv2_service_load_balancers)"
            classic_count="$(count_classic_service_load_balancers)"
            if (( elbv2_count == 0 && classic_count == 0 )); then
              break
            fi
            (( SECONDS < load_balancer_deadline )) || {
              echo 'Kubernetes-owned GarageFlow LoadBalancer still exists after 15 minutes.' >&2
              exit 1
            }
            sleep 15
          done
          echo 'Kubernetes Service, namespace, and cloud LoadBalancer cleanup completed.'

      - name: Destroy Terraform-managed Academy environment
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/environments/academy destroy -auto-approve -input=false

      - name: Verify environment absence and retained backend
        shell: bash
        run: bash scripts/aws/verify-destroy.sh "${TF_STATE_BUCKET}"
