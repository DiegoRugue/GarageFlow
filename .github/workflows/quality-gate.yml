name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    environment: SONAR_PROJECT_KEY
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      COVERAGE_THRESHOLD: "80"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Postman assets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.parse import unquote

          collection_path = Path("docs/postman/GarageFlow.Phase2.postman_collection.json")
          environment_path = Path("docs/postman/GarageFlow.Phase2.postman_environment.example.json")
          collection = json.loads(collection_path.read_text(encoding="utf-8"))
          environment = json.loads(environment_path.read_text(encoding="utf-8"))

          expected_inventory = [
              ("00 Health and OpenAPI", [
                  "Initialize run and check health",
                  "Check readiness",
                  "Read OpenAPI document",
              ]),
              ("01 Authentication", [
                  "Login with initial password",
                  "Change bootstrap password",
                  "Login with active password",
              ]),
              ("02 Existing-ID Work Order Opening", [
                  "Create existing-ID customer",
                  "Create vehicle brand",
                  "Create vehicle model",
                  "Create vehicle color",
                  "Create existing-ID vehicle",
                  "Create existing-ID service",
                  "Open work order with existing IDs",
              ]),
              ("03 Complete Intake", [
                  "Create complete intake",
                  "Replay complete intake byte-for-byte",
                  "Reject changed complete intake replay",
              ]),
              ("04 Status and Active Queue", [
                  "Read Received status",
                  "Verify active queue inclusion",
              ]),
              ("05 Estimate Submission", [
                  "Submit intake estimate",
                  "Read WaitingApproval status",
                  "Verify WaitingApproval queue inclusion",
              ]),
              ("06 Signed External Decision", [
                  "Approve estimate with signed webhook",
                  "Replay signed webhook byte-for-byte",
                  "Read InProgress status",
                  "Read approved work order details",
              ]),
              ("07 Completion and Delivery", [
                  "Start estimate service",
                  "Read started service details",
                  "Complete estimate service",
                  "Read Completed status",
                  "Verify Completed queue exclusion",
                  "Deliver work order",
                  "Read Delivered status",
                  "Verify Delivered queue exclusion",
              ]),
          ]
          if collection["info"]["schema"] != "https://schema.getpostman.com/json/collection/v2.1.0/collection.json":
              raise SystemExit("Postman collection must use schema v2.1")
          if [folder["name"] for folder in collection["item"]] != [name for name, _ in expected_inventory]:
              raise SystemExit("Postman folders are missing or out of order")

          for folder, (expected_folder_name, expected_request_names) in zip(collection["item"], expected_inventory):
              items = folder.get("item", [])
              if folder["name"] != expected_folder_name:
                  raise SystemExit(f"Unexpected Postman folder {folder['name']}")
              if [item.get("name") for item in items] != expected_request_names:
                  raise SystemExit(f"Folder {expected_folder_name} request inventory or order is not exact")
              if any("request" not in item or "item" in item for item in items):
                  raise SystemExit(f"Folder {expected_folder_name} may contain only the approved requests")

          request_entries = []
          def walk_requests(items, parent):
              for item in items:
                  item_path = f"{parent}/{item.get('name', '<unnamed>')}"
                  if "request" in item:
                      request_entries.append((item_path, item))
                  if "item" in item:
                      walk_requests(item["item"], item_path)

          walk_requests(collection["item"], "collection")
          expected_request_count = sum(len(request_names) for _, request_names in expected_inventory)
          if len(request_entries) != expected_request_count:
              raise SystemExit(f"Postman collection must contain exactly {expected_request_count} requests")

          expected_variable_keys = [
              "baseUrl", "token", "runSuffix", "existingCpf", "intakeCpf", "existingPlate", "intakePlate",
              "existingEmail", "intakeEmail", "existingPhone", "intakePhone", "existingCustomerName",
              "intakeCustomerName", "vehicleBrandName", "vehicleModelName", "vehicleColorName",
              "existingServiceDescription", "intakeServiceDescription", "intakeInventoryName",
              "intakeInventoryDescription", "requestId", "webhookEventId", "customerId", "vehicleBrandId",
              "vehicleModelId", "vehicleColorId", "vehicleId", "serviceId", "existingWorkOrderId", "workOrderId",
              "intakeCustomerId", "intakeVehicleId", "estimateId", "intakeServiceId", "intakeInventoryItemId",
              "estimateServiceLineId", "intakeRawBody", "webhookRawBody", "webhookTimestamp", "webhookOccurredAt",
              "temporaryToken",
          ]
          variable_entries = collection.get("variable", [])
          if [entry.get("key") for entry in variable_entries] != expected_variable_keys:
              raise SystemExit("Collection variable inventory or order is not exact")
          variables = {entry["key"]: entry.get("value", "") for entry in variable_entries}
          secret_keys = {"staffEmail", "staffPassword", "staffActivePassword", "webhookSecret"}
          if secret_keys.intersection(variables):
              raise SystemExit("Environment secrets must not be committed as collection variables")
          if variables.get("baseUrl") != "http://localhost:8080":
              raise SystemExit("Collection baseUrl default is wrong")
          if any(variables[key] != "" for key in expected_variable_keys if key != "baseUrl"):
              raise SystemExit("Collection runtime variables must be committed empty")

          expected_environment_keys = ["baseUrl", "staffEmail", "staffPassword", "staffActivePassword", "webhookSecret"]
          if [entry.get("key") for entry in environment["values"]] != expected_environment_keys:
              raise SystemExit("Example environment variable inventory or order is not exact")
          environment_values = {entry["key"]: entry for entry in environment["values"]}
          if environment_values["baseUrl"].get("value") != "http://localhost:8080":
              raise SystemExit("Example environment baseUrl default is wrong")
          for key in secret_keys:
              if environment_values[key].get("value") != "" or environment_values[key].get("type") != "secret":
                  raise SystemExit(f"Example environment secret {key} must be empty and typed secret")

          sensitive_name = re.compile(
              r"password|passwd|secret|token|credential|api[-_]?key|authorization|signature",
              re.IGNORECASE,
          )
          known_secret_values = (
              "Admin@" + "12345",
              "local-estimate-decision-" + "webhook-secret",
              "jwt-key-" + "change-me",
          )
          generic_credential_patterns = [
              re.compile(r"\beyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b", re.IGNORECASE),
              re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b"),
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----", re.IGNORECASE),
              re.compile("|".join(re.escape(value) for value in known_secret_values), re.IGNORECASE),
          ]
          placeholder = re.compile(r"^\s*(?:Bearer\s+)?\{\{[A-Za-z_][A-Za-z0-9_.-]*\}\}\s*$", re.IGNORECASE)

          def is_allowed_placeholder(value):
              return value == "" or bool(placeholder.fullmatch(value))

          def scan_generic(value, location):
              text = str(value)
              if any(pattern.search(text) for pattern in generic_credential_patterns):
                  raise SystemExit(f"Hardcoded credential pattern found in {location}")

          def scan_credential_object(value, location):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if sensitive_name.search(str(key)) and isinstance(child, str) and not is_allowed_placeholder(child):
                          raise SystemExit(f"Hardcoded credential value found in {location}.{key}")
                      scan_credential_object(child, f"{location}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      scan_credential_object(child, f"{location}[{index}]")
              elif isinstance(value, str):
                  scan_generic(value, location)

          def scan_auth(auth, location):
              if not auth:
                  return
              scan_generic(json.dumps(auth, separators=(",", ":")), location)
              if auth.get("type") == "noauth":
                  return
              for scheme, parameters in auth.items():
                  if scheme == "type":
                      continue
                  if not isinstance(parameters, list):
                      raise SystemExit(f"Auth parameters in {location} must use Postman arrays")
                  for parameter in parameters:
                      value = str(parameter.get("value", ""))
                      if value and not is_allowed_placeholder(value):
                          raise SystemExit(f"Auth value in {location} must be empty or a placeholder")
              if auth.get("type") == "bearer":
                  allowed_bearers = {"{{token}}", "{{temporaryToken}}"}
                  if any(parameter.get("value") not in allowed_bearers for parameter in auth.get("bearer", [])):
                      raise SystemExit(f"Bearer auth in {location} must use an approved token placeholder")

          scan_generic(json.dumps(collection, separators=(",", ":")), "collection")
          scan_generic(json.dumps(environment, separators=(",", ":")), "example environment")
          scan_auth(collection.get("auth"), "collection auth")

          body_assignment = re.compile(
              r"(?P<name>password|passwd|secret|token|credential|api[-_]?key|authorization|signature)"
              r"\s*[\"']?\s*[:=]\s*[\"']?(?P<value>[^\"',&\s}]+)",
              re.IGNORECASE,
          )

          def scan_request_security(path, item):
              request = item["request"]
              location = f"request {path}"
              scan_auth(request.get("auth"), f"{location} auth")

              for header in request.get("header", []):
                  header_name = str(header.get("key", ""))
                  header_value = str(header.get("value", ""))
                  scan_generic(header_value, f"{location} header {header_name}")
                  if header_name.lower() == "authorization":
                      if not re.fullmatch(r"Bearer\s+\{\{(?:token|temporaryToken)\}\}", header_value, re.IGNORECASE):
                          raise SystemExit(f"Authorization header in {location} must use an approved bearer placeholder")
                  elif sensitive_name.search(header_name) and header_value and not is_allowed_placeholder(header_value):
                      raise SystemExit(f"Credential header {header_name} in {location} must use a placeholder")

              url = request.get("url", "")
              raw_url = url if isinstance(url, str) else str(url.get("raw", ""))
              scan_generic(raw_url, f"{location} URL")
              raw_query = raw_url.partition("?")[2]
              query_pairs = []
              for pair in raw_query.split("&") if raw_query else []:
                  name, separator, value = pair.partition("=")
                  if separator:
                      query_pairs.append((unquote(name), unquote(value)))
              if isinstance(url, dict):
                  query_pairs.extend(
                      (str(query.get("key", "")), str(query.get("value", "")))
                      for query in url.get("query", [])
                  )
              for query_name, query_value in query_pairs:
                  scan_generic(query_value, f"{location} query {query_name}")
                  if sensitive_name.search(query_name) and query_value and not is_allowed_placeholder(query_value):
                      raise SystemExit(f"Credential query {query_name} in {location} must use a placeholder")

              body = request.get("body") or {}
              if body.get("mode") == "raw":
                  raw_body = str(body.get("raw", ""))
                  scan_generic(raw_body, f"{location} raw body")
                  try:
                      scan_credential_object(json.loads(raw_body), f"{location} raw body")
                  except json.JSONDecodeError:
                      for match in body_assignment.finditer(raw_body):
                          if not is_allowed_placeholder(match.group("value")):
                              raise SystemExit(f"Hardcoded credential assignment found in {location} raw body")
              for body_key in ("formdata", "urlencoded"):
                  for parameter in body.get(body_key, []):
                      name = str(parameter.get("key", ""))
                      value = str(parameter.get("value", ""))
                      scan_generic(value, f"{location} body field {name}")
                      if sensitive_name.search(name) and value and not is_allowed_placeholder(value):
                          raise SystemExit(f"Credential body field {name} in {location} must use a placeholder")

          for request_path, request_item in request_entries:
              scan_request_security(request_path, request_item)

          scripts = []
          def collect_scripts(node, path):
              for event in node.get("event", []):
                  source = "\n".join(event.get("script", {}).get("exec", []))
                  scripts.append((f"{path}:{event.get('listen', '<unknown>')}", source))
              for child in node.get("item", []):
                  collect_scripts(child, f"{path}/{child.get('name', '<unnamed>')}")

          collect_scripts(collection, "collection")

          aggregate = "\n".join(source for _, source in scripts)
          if re.search(r"console\.(log|warn|error|debug)", aggregate):
              raise SystemExit("Postman scripts must not write values to the console")

          script_literal_patterns = [
              re.compile(
                  r"\b(?:const|let|var)\s+(?P<name>[A-Za-z_$][\w$]*)\s*=\s*"
                  r"(?P<quote>['\"])(?P<value>[^'\"\r\n]+)(?P=quote)",
                  re.MULTILINE,
              ),
              re.compile(
                  r"(?:^|[,{]\s*)(?P<name>[A-Za-z_$][\w$]*)\s*:\s*"
                  r"(?P<quote>['\"])(?P<value>[^'\"\r\n]+)(?P=quote)",
                  re.MULTILINE,
              ),
              re.compile(
                  r"\.set\(\s*(?P<quote1>['\"])(?P<name>[^'\"]+)(?P=quote1)\s*,\s*"
                  r"(?P<quote2>['\"])(?P<value>[^'\"\r\n]+)(?P=quote2)",
                  re.MULTILINE,
              ),
          ]
          scripted_header = re.compile(
              r"key\s*:\s*['\"](?P<name>Authorization|X-Api-Key|X-GarageFlow-Signature)['\"]"
              r".{0,200}?value\s*:\s*['\"](?P<value>[^'\"]+)['\"]",
              re.IGNORECASE | re.DOTALL,
          )
          literal_bearer = re.compile(r"\bBearer\s+(?!\{\{)[A-Za-z0-9._~+/\-]+=*", re.IGNORECASE)
          for name, source in scripts:
              scan_generic(source, f"script {name}")
              if literal_bearer.search(source):
                  raise SystemExit(f"Hardcoded bearer value found in script {name}")
              for pattern in script_literal_patterns:
                  for match in pattern.finditer(source):
                      if sensitive_name.search(match.group("name")) and not is_allowed_placeholder(match.group("value")):
                          raise SystemExit(f"Hardcoded credential literal assigned in script {name}")
              for match in scripted_header.finditer(source):
                  if not is_allowed_placeholder(match.group("value")):
                      raise SystemExit(f"Hardcoded credential header literal found in script {name}")

          required_markers = [
              "generateCpf",
              "isValidCpf",
              "generateMercosulPlate",
              "[200, 401]",
              "pm.execution.setNextRequest",
              "intakeRawBody",
              "set('intakeCustomerId', payload.customerId)",
              "set('intakeVehicleId', payload.vehicleId)",
              "payload.customerId).to.eql(pm.collectionVariables.get('intakeCustomerId'))",
              "payload.vehicleId).to.eql(pm.collectionVariables.get('intakeVehicleId'))",
              "changedPayload.services[0].price",
              "pm.require('npm:crypto-js@4.2.0')",
              "typeof pm.require === 'function'",
              "CryptoLibrary.enc.Hex",
              "pm.variables.replaceIn(pm.request.body.raw)",
              "HmacSHA256(timestamp + '.' + rawBody, secret)",
              "webhookRawBody",
              "WaitingApproval",
              "InProgress",
              "Completed work order is excluded from the active queue",
              "Delivered work order is excluded from the active queue",
          ]
          missing = [marker for marker in required_markers if marker not in aggregate]
          if missing:
              raise SystemExit("Postman scripts are missing required guards: " + ", ".join(missing))

          for name, source in scripts:
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as script_file:
                  script_file.write(source)
                  script_path = Path(script_file.name)
              try:
                  subprocess.run(["node", "--check", str(script_path)], check=True)
              except subprocess.CalledProcessError as error:
                  raise SystemExit(f"JavaScript syntax failed for {name}") from error
              finally:
                  script_path.unlink(missing_ok=True)

          print(f"Validated {len(request_entries)} Postman requests and {len(scripts)} scripts")
          PY

      - name: Validate Documentation Links
        run: pwsh -File scripts/validate-doc-links.ps1

      - name: Inspect k6 Load Test
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none \
            --volume "${PWD}:/workspace:ro" \
            --workdir /workspace \
            --env BASE_URL=http://127.0.0.1:8080 \
            --env STAFF_EMAIL=ci-inspect@example.invalid \
            --env STAFF_PASSWORD=ci-inspect-only-password \
            --env WORK_ORDER_ID=00000000-0000-4000-8000-000000000001 \
            grafana/k6:1.7.1 \
            inspect --include-system-env-vars scripts/load-test/work-orders.js

      - name: Validate Generated Phase 2 Diagrams
        shell: bash
        run: |
          set -Eeuo pipefail
          pwsh -File scripts/render-phase2-diagrams.ps1
          git diff --exit-code -- \
            docs/architecture/diagrams/images/application.svg \
            docs/architecture/diagrams/images/application.png \
            docs/architecture/diagrams/images/aws-academy.svg \
            docs/architecture/diagrams/images/aws-academy.png \
            docs/architecture/diagrams/images/kubernetes.svg \
            docs/architecture/diagrams/images/kubernetes.png \
            docs/architecture/diagrams/images/database-reliability.svg \
            docs/architecture/diagrams/images/database-reliability.png \
            docs/architecture/diagrams/images/deployment-flow.svg \
            docs/architecture/diagrams/images/deployment-flow.png \
            docs/ddd/diagrams/images/work-order-state-machine.svg \
            docs/ddd/diagrams/images/work-order-state-machine.png

      - name: Validate Evidence Sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          Get-Content -LiteralPath docs/delivery/phase-2-evidence.schema.json -Raw |
            ConvertFrom-Json -Depth 100 |
            Out-Null

          $tokens = $null
          $parseErrors = $null
          $collectorPath = (Resolve-Path docs/delivery/collect-phase2-evidence.ps1).Path
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $collectorPath,
            [ref] $tokens,
            [ref] $parseErrors)

          if ($parseErrors.Count -ne 0) {
            throw "Evidence collector has $($parseErrors.Count) PowerShell parse error(s)."
          }

          $invokeExpressionCommands = @($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.CommandAst] -and
              $node.GetCommandName() -ceq 'Invoke-Expression'
          }, $true))
          if ($invokeExpressionCommands.Count -ne 0) {
            throw 'Evidence collector must not use Invoke-Expression.'
          }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Validate Terraform
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform fmt -check -recursive infra
          terraform -chdir=infra/bootstrap/state-backend init -backend=false -input=false
          terraform -chdir=infra/bootstrap/state-backend validate
          terraform -chdir=infra/environments/academy init -backend=false -input=false
          terraform -chdir=infra/environments/academy validate

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Detect SonarQube configuration
        id: sonar-config
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -z "${SONAR_HOST_URL}" ]] && missing+=("SONAR_HOST_URL")
          [[ -z "${SONAR_TOKEN}" ]] && missing+=("SONAR_TOKEN")
          [[ -z "${SONAR_ORGANIZATION}" ]] && missing+=("SONAR_ORGANIZATION")
          [[ -z "${SONAR_PROJECT_KEY}" ]] && missing+=("SONAR_PROJECT_KEY")

          if [[ -n "${SONAR_HOST_URL}" && -n "${SONAR_TOKEN}" && -n "${SONAR_ORGANIZATION}" && -n "${SONAR_PROJECT_KEY}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Missing SonarQube configuration: ${missing[*]}"
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Java (SonarQube)
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SonarScanner for .NET
        if: steps.sonar-config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet tool install --global dotnet-sonarscanner
          echo "${HOME}/.dotnet/tools" >> "${GITHUB_PATH}"

      - name: Restore
        run: dotnet restore GarageFlow.slnx

      - name: SonarQube Begin
        id: sonar-begin
        if: steps.sonar-config.outputs.enabled == 'true'
        shell: bash
        run: >
          dotnet sonarscanner begin
          /o:"${SONAR_ORGANIZATION}"
          /k:"${SONAR_PROJECT_KEY}"
          /d:sonar.host.url="${SONAR_HOST_URL}"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Tests/E2E/**,**/scripts/seed-local.sql"
          /d:sonar.coverage.exclusions="**/Tests/E2E/**,**/Adapters.Infrastructure/DataAccess/Migrations/**,**/Adapters.Infrastructure/DataAccess/GarageFlowDbContextFactory.cs,**/Adapters.Infrastructure/DataAccess/AutoMigrateGarageFlowExtensions.cs"
          /d:sonar.cpd.exclusions="**/Tests/E2E/**,**/scripts/seed-local.sql,**/Adapters.Infrastructure/DataAccess/Migrations/**"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build GarageFlow.slnx --no-restore -warnaserror

      - name: Architecture Tests
        run: >
          dotnet test Tests/Unit/GarageFlow.Tests.Unit.csproj
          --no-build
          --settings coverlet.runsettings
          --filter "FullyQualifiedName~Architecture"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/Architecture

      - name: Unit Tests
        run: >
          dotnet test Tests/Unit/GarageFlow.Tests.Unit.csproj
          --no-build
          --settings coverlet.runsettings
          --filter "FullyQualifiedName!~Architecture"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/Unit

      - name: Integration Tests
        run: >
          dotnet test Tests/Integration/GarageFlow.Tests.Integration.csproj
          --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/Integration
          --
          RunConfiguration.MaxCpuCount=1

      - name: E2E Tests Against PostgreSQL
        run: >
          dotnet test Tests/E2E/GarageFlow.Tests.E2E.csproj
          --no-build
          --results-directory TestResults/E2E
          --logger "trx;LogFileName=e2e.trx"

      - name: Upload E2E TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: TestResults/E2E/e2e.trx
          if-no-files-found: ignore

      - name: Validate Coverage Threshold (80%)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          report_files = glob.glob("TestResults/**/coverage.opencover.xml", recursive=True)
          if not report_files:
              raise SystemExit("No OpenCover reports found under TestResults/**/coverage.opencover.xml")

          covered_points = set()
          total_points = set()

          for report_path in report_files:
              root = ET.parse(report_path).getroot()
              for module in root.findall(".//Module"):
                  file_by_id = {
                      file_node.attrib.get("uid", ""): file_node.attrib.get("fullPath", "")
                      for file_node in module.findall("./Files/File")
                  }

                  for sequence_point in module.findall(".//SequencePoint"):
                      file_id = sequence_point.attrib.get("fileid", "")
                      key = (
                          file_by_id.get(file_id, file_id),
                          sequence_point.attrib.get("sl", ""),
                          sequence_point.attrib.get("sc", ""),
                          sequence_point.attrib.get("el", ""),
                          sequence_point.attrib.get("ec", ""),
                      )
                      total_points.add(key)

                      if int(sequence_point.attrib.get("vc", "0")) > 0:
                          covered_points.add(key)

          total = len(total_points)
          covered = len(covered_points)
          coverage = (covered / total * 100) if total else 0.0

          print(f"Coverage total: {coverage:.2f}% ({covered}/{total} sequence points)")

          if coverage < threshold:
              raise SystemExit(f"Coverage {coverage:.2f}% is below threshold {threshold:.2f}%")

          print(f"Coverage check passed: {coverage:.2f}% >= {threshold:.2f}%")
          PY

      - name: SonarQube End
        if: always() && steps.sonar-config.outputs.enabled == 'true' && steps.sonar-begin.outcome == 'success'
        shell: bash
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Build Container Image
        shell: bash
        run: docker build -t "garageflow:${GITHUB_SHA}" .

      - name: Smoke Container Image
        shell: bash
        run: bash scripts/smoke-container.sh "garageflow:${GITHUB_SHA}"

      - name: Validate Compose Configuration
        shell: bash
        run: docker compose config --quiet

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Validate Kubernetes Manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered="$(mktemp)"
          trap 'rm -f -- "${rendered}"' EXIT
          chmod 600 "${rendered}"

          kubectl kustomize k8s > "${rendered}"

          if grep -Fq 'template-only' "${rendered}"; then
            echo "Rendered Kubernetes output contains the Secret template marker." >&2
            exit 1
          fi

          variable_marker='$'
          if grep -Fq "${variable_marker}{" "${rendered}"; then
            echo "Rendered Kubernetes output contains an unresolved shell variable marker." >&2
            exit 1
          fi

          if grep -Eq '^kind:[[:space:]]*Secret[[:space:]]*$' "${rendered}"; then
            echo "Rendered Kubernetes output contains a Secret resource." >&2
            exit 1
          fi

          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            -kubernetes-version 1.36.0 \
            - < "${rendered}"
