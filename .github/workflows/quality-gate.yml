name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    environment: SONAR_PROJECT_KEY
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      COVERAGE_THRESHOLD: "80"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Postman assets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          collection_path = Path("docs/postman/GarageFlow.Phase2.postman_collection.json")
          environment_path = Path("docs/postman/GarageFlow.Phase2.postman_environment.example.json")
          collection = json.loads(collection_path.read_text(encoding="utf-8"))
          environment = json.loads(environment_path.read_text(encoding="utf-8"))

          expected_folders = [
              "00 Health and OpenAPI",
              "01 Authentication",
              "02 Existing-ID Work Order Opening",
              "03 Complete Intake",
              "04 Status and Active Queue",
              "05 Estimate Submission",
              "06 Signed External Decision",
              "07 Completion and Delivery",
          ]
          if collection["info"]["schema"] != "https://schema.getpostman.com/json/collection/v2.1.0/collection.json":
              raise SystemExit("Postman collection must use schema v2.1")
          if [folder["name"] for folder in collection["item"]] != expected_folders:
              raise SystemExit("Postman folders are missing or out of order")

          variables = {entry["key"]: entry.get("value", "") for entry in collection.get("variable", [])}
          secret_keys = {"staffEmail", "staffPassword", "staffActivePassword", "webhookSecret"}
          if secret_keys.intersection(variables):
              raise SystemExit("Environment secrets must not be committed as collection variables")
          if variables.get("token") != "":
              raise SystemExit("Committed JWT variable must be empty")

          environment_values = {entry["key"]: entry for entry in environment["values"]}
          if set(environment_values) != {"baseUrl", *secret_keys}:
              raise SystemExit("Example environment has unexpected keys")
          for key in secret_keys:
              if environment_values[key].get("value") != "" or environment_values[key].get("type") != "secret":
                  raise SystemExit(f"Example environment secret {key} must be empty and typed secret")

          scripts = []
          request_names = []
          for folder in collection["item"]:
              for item in folder["item"]:
                  request_names.append(item["name"])
                  for event in item.get("event", []):
                      source = "\n".join(event["script"].get("exec", []))
                      scripts.append((f"{item['name']}:{event['listen']}", source))

          aggregate = "\n".join(source for _, source in scripts)
          if re.search(r"console\.(log|warn|error|debug)", aggregate):
              raise SystemExit("Postman scripts must not write values to the console")

          required_markers = [
              "generateCpf",
              "isValidCpf",
              "generateMercosulPlate",
              "[200, 401]",
              "pm.execution.setNextRequest",
              "intakeRawBody",
              "changedPayload.services[0].price",
              "pm.require('npm:crypto-js@4.2.0')",
              "typeof pm.require === 'function'",
              "CryptoLibrary.enc.Hex",
              "pm.variables.replaceIn(pm.request.body.raw)",
              "HmacSHA256(timestamp + '.' + rawBody, secret)",
              "webhookRawBody",
              "WaitingApproval",
              "InProgress",
              "Completed work order is excluded from the active queue",
              "Delivered work order is excluded from the active queue",
          ]
          missing = [marker for marker in required_markers if marker not in aggregate]
          if missing:
              raise SystemExit("Postman scripts are missing required guards: " + ", ".join(missing))

          required_requests = {
              "Open work order with existing IDs",
              "Create complete intake",
              "Replay complete intake byte-for-byte",
              "Reject changed complete intake replay",
              "Submit intake estimate",
              "Approve estimate with signed webhook",
              "Replay signed webhook byte-for-byte",
              "Start estimate service",
              "Complete estimate service",
              "Deliver work order",
          }
          if not required_requests.issubset(request_names):
              raise SystemExit("Postman collection is missing required Phase 2 requests")

          for name, source in scripts:
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as script_file:
                  script_file.write(source)
                  script_path = Path(script_file.name)
              try:
                  subprocess.run(["node", "--check", str(script_path)], check=True)
              except subprocess.CalledProcessError as error:
                  raise SystemExit(f"JavaScript syntax failed for {name}") from error
              finally:
                  script_path.unlink(missing_ok=True)

          print(f"Validated {len(request_names)} Postman requests and {len(scripts)} scripts")
          PY

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Validate Terraform
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform fmt -check -recursive infra
          terraform -chdir=infra/bootstrap/state-backend init -backend=false -input=false
          terraform -chdir=infra/bootstrap/state-backend validate
          terraform -chdir=infra/environments/academy init -backend=false -input=false
          terraform -chdir=infra/environments/academy validate

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Detect SonarQube configuration
        id: sonar-config
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -z "${SONAR_HOST_URL}" ]] && missing+=("SONAR_HOST_URL")
          [[ -z "${SONAR_TOKEN}" ]] && missing+=("SONAR_TOKEN")
          [[ -z "${SONAR_ORGANIZATION}" ]] && missing+=("SONAR_ORGANIZATION")
          [[ -z "${SONAR_PROJECT_KEY}" ]] && missing+=("SONAR_PROJECT_KEY")

          if [[ -n "${SONAR_HOST_URL}" && -n "${SONAR_TOKEN}" && -n "${SONAR_ORGANIZATION}" && -n "${SONAR_PROJECT_KEY}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Missing SonarQube configuration: ${missing[*]}"
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Java (SonarQube)
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SonarScanner for .NET
        if: steps.sonar-config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet tool install --global dotnet-sonarscanner
          echo "${HOME}/.dotnet/tools" >> "${GITHUB_PATH}"

      - name: Restore
        run: dotnet restore GarageFlow.slnx

      - name: SonarQube Begin
        id: sonar-begin
        if: steps.sonar-config.outputs.enabled == 'true'
        shell: bash
        run: >
          dotnet sonarscanner begin
          /o:"${SONAR_ORGANIZATION}"
          /k:"${SONAR_PROJECT_KEY}"
          /d:sonar.host.url="${SONAR_HOST_URL}"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Tests/E2E/**,**/scripts/seed-local.sql"
          /d:sonar.coverage.exclusions="**/Tests/E2E/**,**/Adapters.Infrastructure/DataAccess/Migrations/**,**/Adapters.Infrastructure/DataAccess/GarageFlowDbContextFactory.cs,**/Adapters.Infrastructure/DataAccess/AutoMigrateGarageFlowExtensions.cs"
          /d:sonar.cpd.exclusions="**/Tests/E2E/**,**/scripts/seed-local.sql,**/Adapters.Infrastructure/DataAccess/Migrations/**"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build GarageFlow.slnx --no-restore -warnaserror

      - name: Architecture Tests
        run: >
          dotnet test Tests/Unit/GarageFlow.Tests.Unit.csproj
          --no-build
          --settings coverlet.runsettings
          --filter "FullyQualifiedName~Architecture"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/Architecture

      - name: Unit Tests
        run: >
          dotnet test Tests/Unit/GarageFlow.Tests.Unit.csproj
          --no-build
          --settings coverlet.runsettings
          --filter "FullyQualifiedName!~Architecture"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/Unit

      - name: Integration Tests
        run: >
          dotnet test Tests/Integration/GarageFlow.Tests.Integration.csproj
          --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/Integration
          --
          RunConfiguration.MaxCpuCount=1

      - name: E2E Tests Against PostgreSQL
        run: >
          dotnet test Tests/E2E/GarageFlow.Tests.E2E.csproj
          --no-build
          --results-directory TestResults/E2E
          --logger "trx;LogFileName=e2e.trx"

      - name: Upload E2E TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: TestResults/E2E/e2e.trx
          if-no-files-found: ignore

      - name: Validate Coverage Threshold (80%)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          report_files = glob.glob("TestResults/**/coverage.opencover.xml", recursive=True)
          if not report_files:
              raise SystemExit("No OpenCover reports found under TestResults/**/coverage.opencover.xml")

          covered_points = set()
          total_points = set()

          for report_path in report_files:
              root = ET.parse(report_path).getroot()
              for module in root.findall(".//Module"):
                  file_by_id = {
                      file_node.attrib.get("uid", ""): file_node.attrib.get("fullPath", "")
                      for file_node in module.findall("./Files/File")
                  }

                  for sequence_point in module.findall(".//SequencePoint"):
                      file_id = sequence_point.attrib.get("fileid", "")
                      key = (
                          file_by_id.get(file_id, file_id),
                          sequence_point.attrib.get("sl", ""),
                          sequence_point.attrib.get("sc", ""),
                          sequence_point.attrib.get("el", ""),
                          sequence_point.attrib.get("ec", ""),
                      )
                      total_points.add(key)

                      if int(sequence_point.attrib.get("vc", "0")) > 0:
                          covered_points.add(key)

          total = len(total_points)
          covered = len(covered_points)
          coverage = (covered / total * 100) if total else 0.0

          print(f"Coverage total: {coverage:.2f}% ({covered}/{total} sequence points)")

          if coverage < threshold:
              raise SystemExit(f"Coverage {coverage:.2f}% is below threshold {threshold:.2f}%")

          print(f"Coverage check passed: {coverage:.2f}% >= {threshold:.2f}%")
          PY

      - name: SonarQube End
        if: always() && steps.sonar-config.outputs.enabled == 'true' && steps.sonar-begin.outcome == 'success'
        shell: bash
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Build Container Image
        shell: bash
        run: docker build -t "garageflow:${GITHUB_SHA}" .

      - name: Smoke Container Image
        shell: bash
        run: bash scripts/smoke-container.sh "garageflow:${GITHUB_SHA}"

      - name: Validate Compose Configuration
        shell: bash
        run: docker compose config --quiet

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Validate Kubernetes Manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered="$(mktemp)"
          trap 'rm -f -- "${rendered}"' EXIT
          chmod 600 "${rendered}"

          kubectl kustomize k8s > "${rendered}"

          if grep -Fq 'template-only' "${rendered}"; then
            echo "Rendered Kubernetes output contains the Secret template marker." >&2
            exit 1
          fi

          variable_marker='$'
          if grep -Fq "${variable_marker}{" "${rendered}"; then
            echo "Rendered Kubernetes output contains an unresolved shell variable marker." >&2
            exit 1
          fi

          if grep -Eq '^kind:[[:space:]]*Secret[[:space:]]*$' "${rendered}"; then
            echo "Rendered Kubernetes output contains a Secret resource." >&2
            exit 1
          fi

          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            -kubernetes-version 1.36.0 \
            - < "${rendered}"
