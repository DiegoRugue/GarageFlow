name: Quality Gate

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    environment: SONAR_PROJECT_KEY
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      COVERAGE_THRESHOLD: "80"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure complete Git history for SonarQube
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          target_branch="${BASE_REF:-${DEFAULT_BRANCH:-main}}"
          git check-ref-format --branch "${target_branch}" >/dev/null

          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --prune --unshallow origin
          fi

          git fetch --no-tags --prune origin \
            "+refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
          git rev-parse --verify --quiet \
            "refs/remotes/origin/${target_branch}^{commit}" >/dev/null

          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo 'Git repository remains shallow after history preparation.' >&2
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7

      - name: Validate Terraform
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform fmt -check -recursive infra
          terraform -chdir=infra/bootstrap/state-backend init -backend=false -input=false
          terraform -chdir=infra/bootstrap/state-backend validate
          terraform -chdir=infra/environments/academy init -backend=false -input=false
          terraform -chdir=infra/environments/academy validate

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup kubectl for offline overlay tests
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.0

      - name: Validate Infrastructure Contracts
        shell: bash
        env:
          COVERAGE_FILE: ${{ runner.temp }}/garageflow-test-results/python/.coverage
        run: |
          set -Eeuo pipefail
          python -m pip install --require-hashes -r scripts/requirements-test.txt
          mkdir -p "${RUNNER_TEMP}/garageflow-test-results/python"
          python -m coverage run --branch --source=scripts --omit='scripts/tests/*' -m unittest discover -s scripts/tests -v
          python -m coverage xml -o "${RUNNER_TEMP}/garageflow-test-results/python/coverage.xml"
          python -m coverage report --fail-under=80

      - name: Detect SonarQube configuration
        id: sonar-config
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -z "${SONAR_HOST_URL}" ]] && missing+=("SONAR_HOST_URL")
          [[ -z "${SONAR_TOKEN}" ]] && missing+=("SONAR_TOKEN")
          [[ -z "${SONAR_ORGANIZATION}" ]] && missing+=("SONAR_ORGANIZATION")
          [[ -z "${SONAR_PROJECT_KEY}" ]] && missing+=("SONAR_PROJECT_KEY")

          if [[ -n "${SONAR_HOST_URL}" && -n "${SONAR_TOKEN}" && -n "${SONAR_ORGANIZATION}" && -n "${SONAR_PROJECT_KEY}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Missing SonarQube configuration: ${missing[*]}"
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Java (SonarQube)
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SonarScanner for .NET
        if: steps.sonar-config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet tool install --global dotnet-sonarscanner
          echo "${HOME}/.dotnet/tools" >> "${GITHUB_PATH}"

      - name: Restore
        run: dotnet restore GarageFlow.slnx

      - name: SonarQube Begin
        id: sonar-begin
        if: steps.sonar-config.outputs.enabled == 'true'
        shell: bash
        run: >
          dotnet sonarscanner begin
          /o:"${SONAR_ORGANIZATION}"
          /k:"${SONAR_PROJECT_KEY}"
          /d:sonar.host.url="${SONAR_HOST_URL}"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.cs.opencover.reportsPaths="${RUNNER_TEMP}/garageflow-test-results/**/coverage.opencover.xml"
          /d:sonar.python.version="3.12"
          /d:sonar.python.coverage.reportPaths="${RUNNER_TEMP}/garageflow-test-results/python/coverage.xml"
          /d:sonar.exclusions="**/Tests/E2E/**,**/scripts/seed-local.sql"
          /d:sonar.coverage.exclusions="**/Tests/E2E/**,**/scripts/tests/**,**/Adapters.Infrastructure/DataAccess/Migrations/**,**/Adapters.Infrastructure/DataAccess/GarageFlowDbContextFactory.cs,**/Adapters.Infrastructure/DataAccess/AutoMigrateGarageFlowExtensions.cs"
          /d:sonar.cpd.exclusions="**/Tests/E2E/**,**/scripts/seed-local.sql,**/Adapters.Infrastructure/DataAccess/Migrations/**"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build GarageFlow.slnx --no-restore -warnaserror

      - name: Architecture Tests
        run: >
          dotnet test Tests/Unit/GarageFlow.Tests.Unit.csproj
          --no-build
          --settings coverlet.runsettings
          --filter "FullyQualifiedName~Architecture"
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/garageflow-test-results/Architecture"

      - name: Unit Tests
        run: >
          dotnet test Tests/Unit/GarageFlow.Tests.Unit.csproj
          --no-build
          --settings coverlet.runsettings
          --filter "FullyQualifiedName!~Architecture"
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/garageflow-test-results/Unit"

      - name: Integration Tests
        run: >
          dotnet test Tests/Integration/GarageFlow.Tests.Integration.csproj
          --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/garageflow-test-results/Integration"
          --
          RunConfiguration.MaxCpuCount=1

      - name: E2E Tests Against PostgreSQL
        run: >
          dotnet test Tests/E2E/GarageFlow.Tests.E2E.csproj
          --no-build
          --results-directory "${{ runner.temp }}/garageflow-test-results/E2E"
          --logger "trx;LogFileName=e2e.trx"

      - name: Upload E2E TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: ${{ runner.temp }}/garageflow-test-results/E2E/e2e.trx
          if-no-files-found: ignore

      - name: Validate Coverage Threshold (80%)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          report_pattern = os.path.join(os.environ["RUNNER_TEMP"], "garageflow-test-results", "**", "coverage.opencover.xml")
          report_files = glob.glob(report_pattern, recursive=True)
          if not report_files:
              raise SystemExit("No OpenCover reports found in the runner temporary results directory")

          covered_points = set()
          total_points = set()

          for report_path in report_files:
              root = ET.parse(report_path).getroot()
              for module in root.findall(".//Module"):
                  file_by_id = {
                      file_node.attrib.get("uid", ""): file_node.attrib.get("fullPath", "")
                      for file_node in module.findall("./Files/File")
                  }

                  for sequence_point in module.findall(".//SequencePoint"):
                      file_id = sequence_point.attrib.get("fileid", "")
                      key = (
                          file_by_id.get(file_id, file_id),
                          sequence_point.attrib.get("sl", ""),
                          sequence_point.attrib.get("sc", ""),
                          sequence_point.attrib.get("el", ""),
                          sequence_point.attrib.get("ec", ""),
                      )
                      total_points.add(key)

                      if int(sequence_point.attrib.get("vc", "0")) > 0:
                          covered_points.add(key)

          total = len(total_points)
          covered = len(covered_points)
          coverage = (covered / total * 100) if total else 0.0

          print(f"Coverage total: {coverage:.2f}% ({covered}/{total} sequence points)")

          if coverage < threshold:
              raise SystemExit(f"Coverage {coverage:.2f}% is below threshold {threshold:.2f}%")

          print(f"Coverage check passed: {coverage:.2f}% >= {threshold:.2f}%")
          PY

      - name: SonarQube End
        if: always() && steps.sonar-config.outputs.enabled == 'true' && steps.sonar-begin.outcome == 'success'
        shell: bash
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Build Container Image
        shell: bash
        run: docker build -t "garageflow:${GITHUB_SHA}" .

      - name: Smoke Container Image
        shell: bash
        run: bash scripts/smoke-container.sh "garageflow:${GITHUB_SHA}"

      - name: Validate Compose Configuration
        shell: bash
        run: docker compose config --quiet

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.0

      - name: Validate Kubernetes Manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered="$(mktemp)"
          trap 'rm -f -- "${rendered}"' EXIT
          chmod 600 "${rendered}"

          kubectl kustomize k8s > "${rendered}"

          if grep -Fq 'template-only' "${rendered}"; then
            echo "Rendered Kubernetes output contains the Secret template marker." >&2
            exit 1
          fi

          variable_marker='$'
          if grep -Fq "${variable_marker}{" "${rendered}"; then
            echo "Rendered Kubernetes output contains an unresolved shell variable marker." >&2
            exit 1
          fi

          if grep -Eq '^kind:[[:space:]]*Secret[[:space:]]*$' "${rendered}"; then
            echo "Rendered Kubernetes output contains a Secret resource." >&2
            exit 1
          fi

          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            -kubernetes-version 1.36.0 \
            - < "${rendered}"
